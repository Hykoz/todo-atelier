name: Vérification de sécurité

# Se lance automatiquement à chaque envoi de code, et peut aussi être
# relancé manuellement depuis l'onglet "Actions" de GitHub.
on:
  push:
  workflow_dispatch:

jobs:
  audit-dependances:
    name: Scan des dépendances (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances du back
        working-directory: ./back
        run: npm ci

      - name: Scanner les dépendances
        working-directory: ./back
        run: npm audit --audit-level=high

  analyse-statique:
    name: Analyse statique (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Semgrep
        run: pip install semgrep

      - name: Lancer Semgrep
        run: semgrep --error --config .semgrep/regles.yml back/src --metrics=off
